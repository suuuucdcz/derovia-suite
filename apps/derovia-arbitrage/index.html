<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derovia Arbitrage</title>
  </head>
  <body>
    <!-- ═══ La porte : aucun outil sans compte ═══════════════════════════ -->
    <div class="launcher" id="porte" hidden></div>

    <!-- ═══ Préparation du premier lancement ═════════════════════════════ -->
    <div class="launcher" id="setup" hidden></div>

    <!-- ═══ Écran de lancement ═══════════════════════════════════════════ -->
    <div class="launcher" id="launcher" hidden>
      <header class="launcher__topbar"></header>

      <div class="launcher__body">
        <div class="launcher__hero">
          <div class="launcher__mark" aria-hidden="true">D</div>
          <h1 class="launcher__wordmark">Derovia</h1>
          <p class="launcher__tagline">
            Suite d'outils d'automatisation. Des décisions chiffrées, calculées
            sur votre machine.
          </p>
        </div>

        <div class="launcher__section-label">Outils</div>
        <div class="tool-grid" id="tool-grid"></div>
      </div>

      <footer class="launcher__footer" id="launcher-footer"></footer>
    </div>

    <!-- ═══ Espace de travail ════════════════════════════════════════════ -->
    <div class="app-shell" id="workspace" hidden>
      <aside class="sidebar">
        <button class="sidebar__brand" type="button" id="back-to-launcher"
                title="Revenir à l'accueil de la suite">
          <span class="sidebar__mark" aria-hidden="true">D</span>
          <span class="sidebar__wordmark">Derovia</span>
        </button>

        <nav class="sidebar__section" id="sidebar-nav" aria-label="Outils de la suite">
          <div class="sidebar__label">Outils</div>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="topbar__title">
            <h1>Arbitrage</h1>
            <p class="topbar__subtitle" id="app-subtitle">
              Acheter ou louer, chiffres à l'appui
            </p>
          </div>
          <div class="topbar__actions">
            <button class="btn btn--secondary" type="button" id="action-reset">
              Réinitialiser
            </button>
            <button class="btn btn--primary" type="button" id="action-copy">
              Copier le résumé
            </button>
          </div>
        </header>

        <div class="scroll-area">
          <div class="layout">
            <div class="stack" id="form-column"></div>
            <div class="stack" id="result-column"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- ═══ Fenêtre de compte ════════════════════════════════════════════ -->

    <!-- ═══ Scénarios enregistrés ════════════════════════════════════════ -->
    <div class="modal" id="scenarios-modal" hidden>
      <div class="modal__veil" data-close-scenarios></div>
      <div class="modal__card modal__card--wide" role="dialog" aria-modal="true"
           aria-labelledby="scenarios-title">
        <button class="modal__close" type="button" data-close-scenarios aria-label="Fermer">×</button>

        <h2 class="modal__title" id="scenarios-title">Mes scénarios</h2>
        <p class="modal__lede">
          Enregistrez un arbitrage pour le retrouver depuis n'importe quel poste.
        </p>

        <form class="scenario-save" id="scenario-save">
          <label class="field">
            <span class="field__label">Nom du scénario</span>
            <span class="input">
              <input type="text" id="scenario-nom" maxlength="80" placeholder="Appartement Lyon 3e" />
            </span>
          </label>
          <button class="btn btn--primary" type="submit" id="scenario-enregistrer">Enregistrer</button>
        </form>

        <p class="auth-form__note" id="scenarios-message" hidden></p>

        <div class="scenario-list" id="scenarios-liste"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
