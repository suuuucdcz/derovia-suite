    <linearGradient id="fond" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/>
      <stop offset="1" stop-color="#0046C7"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="236" fill="url(#fond)"/>
  <rect x="240" y="372" width="404" height="104" rx="52" fill="#FFFFFF" opacity="0.58"/>
  <rect x="240" y="548" width="576" height="104" rx="52" fill="#FFFFFF"/>
</svg>
