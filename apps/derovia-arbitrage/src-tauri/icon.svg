<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Marque Derovia Arbitrage.
       Le carre arrondi et le degrade sont l'identite de la suite ; le glyphe
       change d'un outil a l'autre. Ici, deux barres de longueurs inegales :
       la comparaison, lisible des 32 pixels. -->
